<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Tasks</title>
  <link rel="stylesheet" href="../themes.css">
  <link rel="stylesheet" href="../prefs/prefs.css">
  <link rel="stylesheet" href="tasks.css">
  <script src="../prefs/i18n-early.js"></script>
</head>
<body>
  <header class="titlebar" dir="ltr">
    <div class="brand">
      <span class="logo tasks-logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4 4 10-10"/></svg></span>
      <b data-t="Tasks">Tasks</b>
    </div>
    <div class="win-btns">
      <button data-win="minimize" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
      <button data-win="close" class="close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
    </div>
  </header>

  <div class="body">
    <nav class="side" aria-label="Lists">
      <label class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="find" data-t-placeholder="Search tasks" placeholder="Search tasks" spellcheck="false" autocomplete="off">
      </label>
      <a href="#" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg><span data-t="Today">Today</span><span class="n"></span></a>
      <a href="#" data-view="upcoming"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span data-t="Upcoming">Upcoming</span><span class="n"></span></a>
      <a href="#" data-view="all"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span data-t="All tasks">All tasks</span><span class="n"></span></a>
      <a href="#" data-view="done"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5.5"/></svg><span data-t="Done">Done</span><span class="n"></span></a>
      <div class="side-h" data-t="Tags">Tags</div>
      <div id="tag-filters"></div>
    </nav>

    <main class="content">
      <div class="head">
        <div>
          <h1 id="view-title" data-t="Today">Today</h1>
          <div class="sub" id="view-sub"></div>
        </div>
        <div class="head-tools">
          <div class="seg" role="radiogroup" aria-label="Sort" id="sort">
            <button role="radio" data-sort="due" data-t="By time">By time</button>
            <button role="radio" data-sort="tag" data-t="By priority">By priority</button>
          </div>
          <button class="btn" id="clear-done" hidden data-t="Clear done">Clear done</button>
        </div>
      </div>

      <form class="adder" id="adder" autocomplete="off">
        <div class="adder-row">
          <span class="adder-plus" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
          <input id="add-title" maxlength="200" data-t-placeholder="Add a task, then press Enter" placeholder="Add a task, then press Enter">
          <button class="btn accent" type="submit" data-t="Add">Add</button>
        </div>
        <div class="adder-opts">
          <div class="chips" id="add-when">
            <button type="button" data-when="none" data-t="No date">No date</button>
            <button type="button" data-when="today" data-t="Today">Today</button>
            <button type="button" data-when="tomorrow" data-t="Tomorrow">Tomorrow</button>
            <button type="button" data-when="pick" data-t="Pick…">Pick…</button>
          </div>
          <input type="datetime-local" id="add-due" hidden>
          <select id="add-remind" aria-label="Reminder"></select>
          <div class="tags-pick" id="add-tag" role="radiogroup" aria-label="Tag"></div>
        </div>
      </form>

      <div id="list" class="list"></div>
      <div id="empty" class="empty" hidden></div>
    </main>

    <aside class="editor" id="editor" hidden aria-label="Task">
      <div class="ed-head">
        <b data-t="Task">Task</b>
        <button class="icon-btn" id="ed-close" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <label class="fld"><span data-t="Title">Title</span><input id="ed-title" maxlength="200"></label>
      <label class="fld"><span data-t="Notes">Notes</span><textarea id="ed-notes" maxlength="2000" rows="5"></textarea></label>
      <label class="fld"><span data-t="Due">Due</span>
        <div class="due-row"><input type="datetime-local" id="ed-due"><button class="btn" id="ed-nodue" type="button" data-t="No date">No date</button></div>
      </label>
      <label class="fld"><span data-t="Reminder">Reminder</span><select id="ed-remind"></select></label>
      <div class="fld"><span data-t="Tag">Tag</span><div class="tags-pick" id="ed-tag" role="radiogroup" aria-label="Tag"></div></div>
      <div class="ed-meta" id="ed-meta"></div>
      <div class="ed-actions">
        <button class="btn danger" id="ed-delete" data-t="Delete">Delete</button>
        <button class="btn accent" id="ed-save" data-t="Save">Save</button>
      </div>
    </aside>
  </div>
  <div class="toast" id="toast" hidden></div>
  <script src="../time-format.js"></script>
  <script src="tasks.js"></script>
</body>
</html>
