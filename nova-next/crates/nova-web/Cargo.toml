[package]
name = "nova-web"
version = "0.0.0"
edition = "2021"
publish = false

# WebView2 hosting for Nova's pages: environment, transparent controller, the embedded page files
# served at https://nova.island/, and the Electron IPC bridge (the original preload files).
[dependencies]
nova-assets = { path = "../nova-assets" }
webview2-com = "=0.39.1"
windows-core = "0.62"
serde_json = "1"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]
