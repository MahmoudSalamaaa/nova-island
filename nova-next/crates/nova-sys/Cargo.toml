[package]
name = "nova-sys"
version = "0.0.0"
edition = "2021"
publish = false

# The C# helper (helper/nova-helper.exe) inside the app: media sessions, VLC, volume, brightness,
# full screen, keyboard, clipboard, idle, battery, recorders, the window in front, the browser's
# address bar. Same status line every 500 ms and the same commands.
[dependencies]
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Media_Control",
  "ApplicationModel",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Wmi",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.62"

[dependencies.windows-future]
version = "0.3"
